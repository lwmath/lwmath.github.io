- title: "Bernstein-type theorems for geometric PDEs"
  date: "2025-07-29"
  category: seminar
  event: "Geometric Analysis Seminar"
  institution: "Institute for Theoretical Sciences, Westlake University"
  location: "Hangzhou, China"
  abstract: >-
     In this talk, I will present several Bernstein-type theorems for geometric PDEs, including minimal surface equations, Monge-Ampère equations, affine maximal surface equations, linearized Monge-Ampère equations, and Allen-Cahn equations. This presentation is based on an expository article by Connor Mooney, as well as several of my joint works with Bin Zhou, Wenkui Du, and Yang Yang.

