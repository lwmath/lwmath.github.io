- title: "Interior estimates for the Monge–Ampère type fourth-order equations"
  date: "2025-05-06"
  category: seminar
  event: "Mathematics Colloquium"
  institution: "School of Mathematical Sciences, Nankai University"
  location: "Tianjin, China"
  abstract: >-
     In this talk, I will present new methods for studying interior estimates of Monge-Ampère type fourth-order equations. In two dimensions, we establish estimates for the homogeneous case using the partial Legendre transform, and for the inhomogeneous case, we apply integral techniques based on the Monge-Ampère Sobolev inequality, which works even for singular right-hand sides. In higher dimensions, we obtain interior regularity under integral bounds on the second derivatives and the inverse of determinant. Finally, I will also discuss possible extensions of the partial Legendre transform to higher-dimensional settings. This talk is based on a joint work with Bin Zhou.

