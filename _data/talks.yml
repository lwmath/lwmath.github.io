- title: "Partial Legendre transform: two-dimensional and higher-dimensional cases"
  date: "2025-04-17"
  category: seminar
  event: "Geometry & Analysis Seminar"
  institution: "School of Mathematical Sciences, Shanghai Jiao Tong University"
  location: "Shanghai, China"
  abstract: >-
    In this talk, I will first introduce the application of the partial Legendre transform to two-dimensional Monge-Ampère type equations, based on my recent joint works with Bin Zhou. Then, I will extend this framework to higher dimensions based on the results of Rios-Sawyer-Wheeden and Le-Savin, which may provide insights into possible generalizations of these techniques to higher-dimensional Monge-Ampère type fourth-order equations.

