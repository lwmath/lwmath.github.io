- title: "A revisit to affine Bernstein problem"
  date: "2022-03-30"
  category: seminar
  event: "Geometric PDE Seminar"
  institution: "Academy of Mathematics and Systems Science, Chinese Academy of Sciences"
  location: "Beijing, China"
  abstract: >-
    In this report, I'll go through the proof of affine Bernstein problem given by Trudinger and Wang \cite{TW}, and I mainly introduce the idea about how to get the all dimensional conclusions under the assumption of uniform, "strict convexity" and just mention the proof of dimension two, which is the Chern conjecture \cite{Ch}. It is because their method for dimension two can not be extended to higher dimensions, even for dimension 3 and there are also other proofs of Chern's conjecture in dimension two. In the end, it is also worthy to mention that they produced a (non-smooth) counterexample for $n\geq 10$. This lecture is a seminar report，mainly introduce the existence work.
