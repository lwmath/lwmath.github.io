- title: "A brief introduction to anisotropic minimal surfaces"
  date: "2026-09-18"
  category: seminar
  event: "Geometric Analysis and PDE Seminar"
  institution: "Department of Mathematics, School of Sciences, Great Bay University"
  location: "Dongguan, China"
  note: "Online"
  abstract: >-
    In this talk, I will give a brief introduction to the theory of anisotropic minimal surfaces, starting from the classical area functional and its anisotropic counterparts, in which the surface energy depends on the tangent plane or, in the hypersurface case, on the unit normal. I will discuss some of the main questions concerning existence, rectifiability, and regularity, together with their historical development. Particular attention will be paid to the absence, for general anisotropic integrands, of the monotonicity formula available in the classical setting, and to the additional difficulties this creates in the study of minimizers and stationary varifolds. I will conclude with some recent developments in anisotropic min-max theory, including joint work with Antonio De Rosa and Aria Halavati.

- title: "An anisotropic stable Bernstein theorem and application"
  date: "2026-08-25"
  category: seminar
  event: "Seminar"
  institution: "College of Mathematics and Statistics, Chongqing University"
  location: "Chongqing, China"
  abstract: >-
    In this talk, I will discuss an explicit two-dimensional stable Bernstein theorem for autonomous anisotropic surface energies. Under an ellipticity ratio bound less than 8, we show that every complete two-sided anisotropic minimal surface in \(\mathbb R^3\) which is stable must be planar. As an application, I will explain how this result appears as a blow-up input in a removable-singularity argument for anisotropic min--max surfaces, based on recent joint work with Antonio De Rosa and Aria Halavati.

- title: "A Simon–Smith min-max theory for anisotropic minimal surfaces with genus bound"
  date: "2026-08-16"
  end_date: "2026-08-22"
  category: conference
  event: "Workshop on Geometric Measure Theory and Partial Differential Equations"
  institution: "Tianyuan Mathematical Center in Central China, Hubei Minzu University"
  location: "Enshi, China"
  abstract: >-
    In this talk, I will discuss a Simon–Smith min-max theory for anisotropic minimal surfaces in closed three-manifolds, with controlled genus. The starting point is an anisotropic analogue of the celebrated theorem of Meeks–Simon–Yau: every minimizing sequence of surfaces within a fixed isotopy class converges, as varifolds, to a smooth stable anisotropic minimal surface, possibly with multiplicity, with lower semicontinuity of genus. This result strengthens previous existence theorems for anisotropic Plateau problems and provides the compactness needed for a topological min-max construction. As an application, we prove the existence of closed embedded anisotropic minimal surfaces with controlled genus in arbitrary closed three-manifolds. This is joint work with Antonio De Rosa and Aria Halavati.

