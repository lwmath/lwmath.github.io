<!-- _includes/pubs-by-time.html -->

<ol id="lw-time-ol" reversed>
  {% for pub in site.data.publications.items %}
    {% include publication-item.html pub=pub %}
  {% endfor %}
</ol>

<script>
  (function() {
    const ol = document.querySelector('#lw-time-panel ol#lw-time-ol');
    if (!ol) return;

    const n = ol.querySelectorAll('li').length;

    if (n > 0) {
      ol.setAttribute('start', n);
    }
  })();
</script>
