<!-- _includes/pubs-by-topic.html -->

{% for topic in site.data.publications.topics %}
  <h2>{{ topic.title }}</h2>

  <ul>
    {% for pub in site.data.publications.items %}
      {% if pub.topic == topic.key %}
        {% include publication-item.html pub=pub %}
      {% endif %}
    {% endfor %}
  </ul>
{% endfor %}
